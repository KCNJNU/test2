global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: platform-api
    static_configs:
      - targets: [host.docker.internal:3000]
  - job_name: device-gateway
    static_configs:
      - targets: [host.docker.internal:9464]
