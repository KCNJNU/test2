name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: Recorded previous stable production version
        required: true
        type: string
      reason:
        description: Rollback incident/reason
        required: true
        type: string

permissions: {}

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    permissions: { contents: read, deployments: write }
    steps:
      - name: Require configured production gate and valid input
        shell: bash
        env:
          DEPLOY_ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          TARGET_VERSION: ${{ inputs.target_version }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          [[ "$DEPLOY_ENABLED" == 'true' ]]
          [[ "$TARGET_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ -n "$ROLLBACK_REASON" ]]
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Configure SSH
        shell: bash
        run: |
          install -m 0700 -d ~/.ssh
          install -m 0600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy_key
          printf '%s\n' '${{ secrets.DEPLOY_HOST_KEY }}' > ~/.ssh/known_hosts
      - name: Restore previous stable application release
        shell: bash
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9._/-]+$ ]]
          tar -czf deploy-package.tgz deploy scripts/release/release-manifest.mjs
          scp -i ~/.ssh/deploy_key deploy-package.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_ROOT/package' && tar -xzf /tmp/deploy-package.tgz -C '$DEPLOY_ROOT/package' && bash '$DEPLOY_ROOT/package/deploy/host/rollback-release.sh' '$TARGET_VERSION' '${{ github.actor }}'"
      - name: Record rollback summary
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          echo '### Production rollback completed' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Target: \`$TARGET_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Database schema: not downgraded' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "- Reason: $ROLLBACK_REASON" >> "$GITHUB_STEP_SUMMARY"
