node.name = "emqx@127.0.0.1"
node.cookie = "${EMQX_NODE_COOKIE}"

listeners.tcp.default.enable = false
crl_cache {
  refresh_interval = 15m
  http_timeout = 15s
  capacity = 100
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"
  acceptors = 16
  max_connections = 100000
  peer_cert_as_username = cn
  peer_cert_as_clientid = cn
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.pem"
    certfile = "/opt/emqx/etc/certs/server.pem"
    keyfile = "/opt/emqx/etc/certs/server-key.pem"
    verify = verify_peer
    fail_if_no_peer_cert = true
    versions = ["tlsv1.3", "tlsv1.2"]
    enable_crl_check = true
  }
}

authorization {
  no_match = deny
  deny_action = ignore
  sources = [{ type = file, enable = true, path = "/opt/emqx/etc/acl.conf" }]
}

log.console {
  enable = true
  level = warning
  formatter = json
}
log.file.default {
  enable = true
  level = warning
  formatter = json
  path = "/opt/emqx/log/emqx.log"
  rotation_count = 10
  rotation_size = 50MB
}

dashboard.listeners.http.bind = "0.0.0.0:18083"
dashboard.listeners.https.enable = false
