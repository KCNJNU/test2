%% Gateway service certificate CN/client ID is fixed and independently issued.
{allow, {user, "device-gateway"}, subscribe, ["robots/+/heartbeat", "robots/+/telemetry", "robots/+/events", "robots/+/faults", "robots/+/commands/ack"]}.
{allow, {user, "device-gateway"}, publish, ["robots/+/commands"]}.

%% Robot certificate CN is the canonical Robot UUID. Wildcards and separators are rejected during provisioning.
{allow, all, publish, ["robots/${username}/heartbeat", "robots/${username}/telemetry", "robots/${username}/events", "robots/${username}/faults", "robots/${username}/commands/ack"]}.
{allow, all, subscribe, ["robots/${username}/commands"]}.
{deny, all}.
