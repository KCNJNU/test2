services:
  edge:
    ports:
      - ${EDGE_BIND_ADDRESS:-0.0.0.0}:443:8443
    volumes:
      - ${DEPLOY_ROOT:?DEPLOY_ROOT is required}/edge/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DEPLOY_ROOT}/edge/active-upstream.conf:/etc/nginx/conf.d/active-upstream.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}/edge:/run/secrets/edge:ro
